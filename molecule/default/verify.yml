---
- name: Verify stale extension manifests are refreshed on upgrade
  hosts: all
  tasks:
    - name: Read ParamMiner manifest
      ansible.builtin.slurp:
        src: "{{ ansible_env.HOME }}/.BurpSuite/bapps/17d2949a985c4b7ca092728dba871943/BappManifest.bmf"
      register: paraminer_manifest

    # PortSwigger's BApp download endpoint always serves the current latest release regardless
    # of the serial requested, so the post-upgrade SerialVersion can't be asserted as an exact
    # value here. Instead confirm the stale seeded manifest was replaced by a real one.
    - name: Assert ParamMiner manifest was refreshed
      ansible.builtin.assert:
        that:
          - "'SerialVersion: 1' not in (paraminer_manifest.content | b64decode)"
          - "'EntryPoint:' in (paraminer_manifest.content | b64decode)"
        fail_msg: "ParamMiner was not upgraded — stale manifest still present"
