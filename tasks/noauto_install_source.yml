---
- name: Install burpsuite from source
  block:
    - name: Import installed burpsuite version check
      ansible.builtin.include_tasks: noauto_check_installed_version.yml
      when: burpsuite_installed_version is not defined

    - name: Force install if the version numbers do not match
      ansible.builtin.set_fact:
        burpsuite_force_install: true
      when:
        - burpsuite_installed_version is defined
        - burpsuite_installed_version != burpsuite_version

    - name: Install burpsuite from source
      when: burpsuite_installed_version is not defined or burpsuite_force_install
      block:
        - name: Uninstall current burpsuite installation
          ansible.builtin.include_tasks: noauto_uninstall_source.yml

        - name: Retrieve burpsuite installer checksum
          block:
            - name: Fetch release data with pagination support
              ansible.builtin.include_tasks: noauto_fetch_release_checksum.yml

            - name: Set release facts
              ansible.builtin.set_fact:
                burpsuite_download_checksum: "{{ burpsuite_release_data.Sha256Checksum }}"

            - name: Debug checksum
              ansible.builtin.debug:
                msg: "SHA-256 checksum for {{ burpsuite_edition }} Linux {{ burpsuite_version }}: {{ burpsuite_download_checksum }}"

        - name: Set installer script filename
          ansible.builtin.set_fact:
            burpsuite_installer_script: "burpsuite_{{ burpsuite_build_category_id }}_linux_v{{ burpsuite_version | regex_replace('\\.', '_') }}.sh"

        - name: Download burpsuite package
          ansible.builtin.get_url:
            url: "{{ burpsuite_download_url }}"
            dest: "{{ burpsuite_download_dir }}/{{ burpsuite_installer_script }}"
            checksum: "sha256:{{ burpsuite_download_checksum }}"
            mode: "0755"
            owner: root
            group: root
          become: true

        - name: Ensure burpsuite installation folder exists
          ansible.builtin.file:
            path: "{{ burpsuite_install_path }}"
            state: directory
            mode: "0755"
            owner: root
            group: root
          become: true

        - name: Create response.varfile for unattended install
          ansible.builtin.template:
            src: burpsuite_response.varfile.j2
            dest: "{{ burpsuite_download_dir }}/burpsuite_response.varfile"
            owner: root
            group: root
            mode: "0640"
          become: true

        - name: Install burpsuite
          ansible.builtin.command:
            cmd: "/bin/sh {{ burpsuite_installer_script }} -q -varfile burpsuite_response.varfile -overwrite"
            chdir: "{{ burpsuite_download_dir }}"
          changed_when: true
          become: true

        - name: Clean up files
          ansible.builtin.file:
            path: "{{ file }}"
            state: absent
          loop:
            - "{{ burpsuite_download_dir }}/{{ burpsuite_installer_script }}"
            - "{{ burpsuite_download_dir }}/burpsuite_response.varfile"
          loop_control:
            loop_var: file
          become: true

        # install4j only creates its /usr/local/bin symlink when programGroupDisabled is false.
        - name: Create burpsuite launcher symlink
          ansible.builtin.file:
            src: "{{ burpsuite_install_path }}/BurpSuite"
            dest: "/usr/local/bin/{{ burpsuite_launcher_command }}"
            state: link
            force: true
            owner: root
            group: root
          become: true
          when: burpsuite_build_category_id == 'desktop'

        - name: Create desktop file
          block:
            - name: Ensure desktop file directory exists
              ansible.builtin.file:
                path: "/usr/local/share/applications"
                state: directory
                mode: "0755"
                owner: root
                group: root
              become: true

            # Legacy installers drop a predictable .desktop file; the role symlinks to it.
            - name: Create desktop file symlink
              ansible.builtin.file:
                src: "{{ burpsuite_install_path }}/Burp Suite {{ 'Professional' if burpsuite_edition == 'pro' else 'Community Edition' }}.desktop"
                dest: "/usr/local/share/applications/burpsuite-{{ burpsuite_edition }}.desktop"
                state: link
                force: true
                mode: "0644"
                owner: root
                group: root
              become: true
              when: burpsuite_build_category_id != 'desktop'

            # Merged builds: install4j's own entry is disabled (programGroupDisabled), so the
            # role creates both explicit Pro/Community entries itself.
            - name: Create Pro-mode desktop file
              ansible.builtin.template:
                src: burpsuite.desktop.j2
                dest: "/usr/local/share/applications/burpsuite-pro.desktop"
                mode: "0755"
                owner: root
                group: root
              become: true
              vars:
                burpsuite_desktop_product_mode: "pro"
              when: burpsuite_build_category_id == 'desktop'

            - name: Create Community-mode desktop file
              ansible.builtin.template:
                src: burpsuite.desktop.j2
                dest: "/usr/local/share/applications/burpsuite-community.desktop"
                mode: "0755"
                owner: root
                group: root
              become: true
              vars:
                burpsuite_desktop_product_mode: "community"
              when: burpsuite_build_category_id == 'desktop'
