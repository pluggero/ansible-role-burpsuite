---
# BApp extension installation
# Copy and setup operations run synchronously (fast operations)

- name: Copy bapp archive for {{ extension.name }}
  ansible.builtin.copy:
    src: "/tmp/burpsuite_{{ extension.bapp_uuid }}.bapp"
    dest: "{{ burpsuite_download_dir }}/{{ extension.bapp_uuid }}.bapp"
    remote_src: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0665"
  become: true

- name: Create extension directory for {{ extension.name }}
  ansible.builtin.file:
    path: "{{ burpsuite_extensions_dir }}/{{ extension.bapp_uuid }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0775"
  become: true
