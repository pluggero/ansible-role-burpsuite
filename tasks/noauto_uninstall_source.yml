---
- name: Uninstall burpsuite from source
  block:
    - name: Find existing burpsuite folder in {{ burpsuite_install_dir }}
      ansible.builtin.find:
        paths: "{{ burpsuite_install_dir }}"
        # Match both the legacy edition-named and merged "desktop"-named folder schemes.
        patterns:
          - "burpsuite-{{ burpsuite_edition }}*"
          - "burpsuite-desktop*"
        file_type: directory
      register: burpsuite_install_folder

    - name: Remove existing burpsuite installation folder
      ansible.builtin.file:
        path: "{{ folder.path }}"
        state: absent
      loop: "{{ burpsuite_install_folder.files }}"
      loop_control:
        loop_var: folder
      become: true

    - name: Remove burpsuite symlink
      ansible.builtin.file:
        path: "/usr/local/bin/{{ burpsuite_launcher_command }}"
        state: absent
      become: true

    - name: Remove burpsuite desktop file symlink
      ansible.builtin.file:
        path: "/usr/local/share/applications/burpsuite-{{ burpsuite_edition }}.desktop"
        state: absent
      become: true
      when: burpsuite_build_category_id != 'desktop'

    - name: Remove burpsuite Pro-mode and Community-mode desktop files
      ansible.builtin.file:
        path: "/usr/local/share/applications/burpsuite-{{ item }}.desktop"
        state: absent
      loop:
        - pro
        - community
      become: true
      when: burpsuite_build_category_id == 'desktop'
