---
burpsuite_config_dir: "{{ ansible_env.HOME }}/.BurpSuite"

burpsuite_version: "2026.6"
# Still drives BApp lists and UserConfig naming; desktop-entry/launcher selection uses
# burpsuite_build_category_id instead.
burpsuite_edition: "community"
# PortSwigger merged Community/Pro into a single "desktop" build from version 2026.4 onward.
burpsuite_build_category_id: "{{ 'desktop' if burpsuite_version is version('2026.4', '>=') else burpsuite_edition }}"
# Merged builds ship one launcher binary ("BurpSuite") regardless of edition.
burpsuite_launcher_command: "{{ 'BurpSuite' if burpsuite_build_category_id == 'desktop' else ('BurpSuitePro' if burpsuite_edition == 'pro' else 'BurpSuiteCommunity') }}"
burpsuite_release_channel: "Stable"
burpsuite_install_method: "source"
burpsuite_force_install: false

burpsuite_download_url: "https://portswigger.net/burp/releases/download?product={{ burpsuite_build_category_id }}&type=linux&version={{ burpsuite_version }}"
burpsuite_download_dir: "/tmp"

burpsuite_install_dir: "/opt"
burpsuite_install_path: "{{ burpsuite_install_dir }}/burpsuite-{{ burpsuite_build_category_id }}-{{ burpsuite_version }}"

burpsuite_extensions_dir: "{{ burpsuite_config_dir }}/bapps"
burpsuite_extension_runtimes_dir: "{{ burpsuite_extensions_dir }}/runtimes"

burpsuite_extension_runtime_jython_version: "2.7.4"
burpsuite_extension_runtime_jython_jar: "jython-standalone.jar"
burpsuite_extension_runtime_jython_url: "https://repo1.maven.org/maven2/org/python/jython-standalone/{{ burpsuite_extension_runtime_jython_version }}/jython-standalone-{{ burpsuite_extension_runtime_jython_version }}.jar"
burpsuite_extension_runtime_jython_checksum_url: "{{ burpsuite_extension_runtime_jython_url }}.sha256"

burpsuite_extension_runtime_jruby_version: "10.1.1.0"
burpsuite_extension_runtime_jruby_jar: "jruby-complete.jar"
burpsuite_extension_runtime_jruby_url: "https://repo1.maven.org/maven2/org/jruby/jruby-complete/{{ burpsuite_extension_runtime_jruby_version }}/jruby-complete-{{ burpsuite_extension_runtime_jruby_version }}.jar"
burpsuite_extension_runtime_jruby_checksum_url: "{{ burpsuite_extension_runtime_jruby_url }}.sha256"

burpsuite_extension_runtimes:
  jython:
    version: "{{ burpsuite_extension_runtime_jython_version }}"
    jar: "{{ burpsuite_extension_runtime_jython_jar }}"
    download_url: "{{ burpsuite_extension_runtime_jython_url }}"
    download_checksum: "sha256:{{ burpsuite_extension_runtime_jython_checksum_url }}"
  jruby:
    version: "{{ burpsuite_extension_runtime_jruby_version }}"
    jar: "{{ burpsuite_extension_runtime_jruby_jar }}"
    download_url: "{{ burpsuite_extension_runtime_jruby_url }}"
    download_checksum: "sha256:{{ burpsuite_extension_runtime_jruby_checksum_url }}"

# Set to true to force-reinstall every already-installed BApp extension on each run. This is the
# only way to refresh an installed extension to whatever PortSwigger currently serves as latest.
burpsuite_bapp_extensions_force_install: false

# BApp Store Extensions
# You can use either the unified list (burpsuite_extensions_bapp) for backward compatibility,
# or separate lists for community and pro editions (burpsuite_extensions_bapp_community and burpsuite_extensions_bapp_pro).
#
# If burpsuite_extensions_bapp is set (non-empty), it will be used directly.
# Otherwise, the appropriate list(s) will be merged based on burpsuite_edition:
#   - community: Only burpsuite_extensions_bapp_community extensions are installed
#   - pro: Both burpsuite_extensions_bapp_community and burpsuite_extensions_bapp_pro extensions are installed
#
# Note: Extensions cannot have duplicate bapp_uuid values across community and pro lists.
#
# Note on bapp_serial_version: PortSwigger's BApp download endpoint always serves the current
# latest release of an extension regardless of the serial requested, so this value cannot pin an
# exact version — it's only used to build the download URL and is recorded in Burp's own
# UserConfig.json. It does not trigger reinstallation of an already-installed extension; use
# burpsuite_bapp_extensions_force_install for that.
#
# Extension Priority:
# - Extensions can have an optional 'priority' field (integer) to control load order
# - Lower priority numbers = higher execution priority (loaded first)
# - Extensions without 'priority' use 1000 + (list position * 1000) as implicit priority
# - Priority is global across all extension types (BApp and external)
# - Example: priority 10 loads before priority 100, which loads before default (1000, 2000, 3000...)

burpsuite_extensions_bapp: []
# - name: "ParamMiner"
#   bapp_uuid: "17d2949a985c4b7ca092728dba871943"
#   bapp_serial_version: "33"
#   use_ai: false
#   loaded: true
#   priority: 10  # Optional: load this extension first

burpsuite_extensions_bapp_community: []
# - name: "ParamMiner"
#   bapp_uuid: "17d2949a985c4b7ca092728dba871943"
#   bapp_serial_version: "33"
#   use_ai: false
#   loaded: true
#   priority: 50  # Optional: controls load order

burpsuite_extensions_bapp_pro: []
# - name: "ActiveScan++"
#   bapp_uuid: "3123d5b5f25c4128894d97ea1acc4976"
#   bapp_serial_version: "50"
#   use_ai: false
#   loaded: true
#   # priority not specified: uses list position * 1000

burpsuite_extensions_external: []
# - name: "CSTC"
#   download_url: "https://github.com/usdAG/cstc/releases/download/v1.3.4/CSTC-1.3.4-jar-with-dependencies.jar"
#   loaded: true
#   priority: 5  # Optional: load before BApp extensions

# Burp Suite Java Preferences
burpsuite_prefs_dir: "{{ ansible_env.HOME }}/.java/.userPrefs/burp"
burpsuite_prefs_file: "{{ burpsuite_prefs_dir }}/prefs.xml"

burpsuite_eula_accepted: false
burpsuite_portswigger_analytics_enabled: false
burpsuite_latest_discover_content_revision: "1"
burpsuite_pro_license: []
# - "your-first-license-key"
# - "your-second-license-key"
burpsuite_additional_prefs: []
# - key: "free.suite.updatesdisabledforaweeksince"
#   value: "2000000000000"

# Collaborator Server Configuration
burpsuite_collaborator_type: "none"
burpsuite_collaborator_location: ""
burpsuite_collaborator_polling_location: ""
burpsuite_collaborator_poll_over_unencrypted_http: false
